{{- if .Values.dex.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ template "argo-cd.dex.fullname" . }}
  namespace: {{ include  "argo-cd.namespace" . }}
  labels:
    {{- include "argo-cd.labels" (dict "context" . "component" .Values.dex.name "name" .Values.dex.name) | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  - configmaps
  verbs:
  - get
  - list
  - watch
{{- if eq (include "argo-cd.dex.storageType" .) "kubernetes" }}
- apiGroups:
  - dex.coreos.com
  resources:
  - authcodes
  - authrequests
  - authsessions
  - connectors
  - devicerequests
  - devicetokens
  - oauth2clients
  - offlinesessionses
  - passwords
  - refreshtokens
  - signingkeies
  - useridentities
  verbs:
  - get
  - list
  - create
  - update
  - delete
{{- end }}
{{- end }}
