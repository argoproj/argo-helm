{{- if and .Values.dex.enabled .Values.createClusterRoles (eq (include "argo-cd.dex.storageType" .) "kubernetes") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "argo-cd.dex.fullname" . }}
  labels:
    {{- include "argo-cd.labels" (dict "context" . "component" .Values.dex.name "name" .Values.dex.name) | nindent 4 }}
rules:
# Dex registers its dex.coreos.com CRDs at startup when they are missing
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - list
  - create
{{- end }}
