{{- if and .Values.dashboard.enabled (not .Values.clusterInstall) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "argo-rollouts.fullname" . }}-dashboard
  namespace: {{ include "argo-rollouts.namespace" . | quote }}
  labels:
    app.kubernetes.io/component: {{ .Values.dashboard.component }}
    {{- include "argo-rollouts.labels" . | nindent 4 }}
rules:
  {{- include "argo-rollouts.dashboard.roleRules" . | nindent 2 }}
{{- end }}
