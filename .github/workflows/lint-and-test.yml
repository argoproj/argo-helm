## Reference: https://github.com/helm/chart-testing-action
name: Linting and Testing
on: pull_request

permissions: {}

jobs:
  linter-artifacthub:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The digest is the same on ECR Public and on the mirror.gcr.io fallback.
      - name: Pull ah image
        id: ah
        env:
          AH_IMAGE: ecr-public.aws.com/artifacthub/ah:v1.14.0@sha256:3773afcdeb5662c31576f1a9a0ee10bced7af2e80842ca06a186a50497e149a5
        run: echo "image=$(./scripts/ci-pull-image.sh "${AH_IMAGE}")" >> "${GITHUB_OUTPUT}"

      - name: Run ah lint
        env:
          AH_IMAGE: ${{ steps.ah.outputs.image }}
        run: docker run --rm --user 1001 --volume "${GITHUB_WORKSPACE}:/work:ro" --workdir /work/charts "${AH_IMAGE}" ah lint

  chart-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3 # Also update in publish.yaml

      - name: Verify subchart digests
        run: |
          set -euo pipefail
          helm repo add dandydeveloper https://dandydeveloper.github.io/charts/
          for chart in charts/*/; do
            helm dependency build "${chart}"
          done
          ./scripts/verify-chart-dependencies.sh

      - name: Set up python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Setup Chart Linting
        id: lint
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0
        with:
          # Note: Also update in scripts/lint.sh
          version: v3.14.0

      - name: List changed charts
        id: list-changed
        run: |
          ## If executed with debug this won't work anymore.
          changed=$(ct --config ./.github/configs/ct-lint.yaml list-changed)
          charts=$(echo "$changed" | tr '\n' ' ' | xargs)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "changed_charts=$charts" >> $GITHUB_OUTPUT
          fi

      - name: Run chart-testing (lint)
        run: ct lint --debug --config ./.github/configs/ct-lint.yaml --lint-conf ./.github/configs/lintconf.yaml

      - name: Check change fragments
        run: ./scripts/lint-changelog.sh

      - name: Run docs-testing (helm-docs)
        id: helm-docs
        run: |
          ./scripts/helm-docs.sh
          if [[ $(git diff --stat) != '' ]]; then
            echo -e '\033[0;31mDocumentation outdated!\033[0m ❌'
            git diff --color
            exit 1
          else
            echo -e '\033[0;32mDocumentation up to date\033[0m ✔'
          fi

      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        if: steps.list-changed.outputs.changed == 'true'
        with:
          config: .github/configs/kind-config.yaml

      - name: Preload ECR Public images into kind
        if: |
          steps.list-changed.outputs.changed == 'true' &&
          contains(steps.list-changed.outputs.changed_charts, 'argo-cd')
        run: ./scripts/ci-preload-images.sh chart-testing

      - name: Deploy latest ArgoCD CRDs when testing ArgoCD extensions
        if: |
          contains(steps.list-changed.outputs.changed_charts, 'argocd-image-updater') ||
          contains(steps.list-changed.outputs.changed_charts, 'argocd-apps')
        run: |
          helm repo add dandydeveloper https://dandydeveloper.github.io/charts/
          helm dependency build charts/argo-cd/
          helm template charts/argo-cd/ --set server.extensions.enabled=true -s templates/crds/* | kubectl apply --server-side=true -f -

      - name: Skip HPA tests of ArgoCD
        if: contains(steps.list-changed.outputs.changed_charts, 'argo-cd')
        run: |
          ## Metrics API not available in kind cluster
          rm charts/argo-cd/ci/ha-autoscaling-values.yaml

      - name: Skip VPA tests of ArgoCD
        if: contains(steps.list-changed.outputs.changed_charts, 'argo-cd')
        run: |
          ## VPA CRDs not available in kind cluster
          rm charts/argo-cd/ci/vpa-values.yaml

      - name: Create an external redis for ArgoCD externalRedis feature
        if: contains(steps.list-changed.outputs.changed_charts, 'argo-cd')
        run: |
          kubectl apply -f ./.github/configs/external-redis.yaml

      - name: Install Gateway API CRDs for ListenerSet testing
        if: contains(steps.list-changed.outputs.changed_charts, 'argo-cd')
        run: |
          kubectl apply --server-side -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.5.0/experimental-install.yaml

      - name: Run chart-testing (install)
        run: ct install --config ./.github/configs/ct-install.yaml
        if: steps.list-changed.outputs.changed == 'true'
