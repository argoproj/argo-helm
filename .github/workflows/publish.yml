## Reference: https://github.com/helm/chart-releaser-action
##
## Charts are packaged and signed in the `package` job, which has read-only
## repository access. The `release` job publishes the signed packages and
## has no access to the signing key.
name: Chart Publish
on:
  push:
    branches:
      - main
    paths:
      - "charts/**"

permissions: {}

# One publish at a time, so index updates and registry pushes do not
# interleave. A queued run picks up every chart changed since the last tag.
concurrency:
  group: chart-publish
  cancel-in-progress: false

jobs:
  ## Its push to main starts the run that releases. It checks out main's tip, not
  ## the pushed commit, so a run that waited in the queue sees every merge.
  fold:
    if: github.repository == 'argoproj/argo-helm'
    permissions:
      contents: read  # pushes go through the release App's token
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.fold.outputs.sha }}
      folded: ${{ steps.fold.outputs.folded }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Fold change fragments
        id: fold
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          ./scripts/fold-changes.sh | tee "${RUNNER_TEMP}/folded.txt"
          if [[ -s "${RUNNER_TEMP}/folded.txt" ]]; then
            echo "folded=true" >> "$GITHUB_OUTPUT"
          else
            echo "folded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get release App token
        if: steps.fold.outputs.folded == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      # The release App is a bypass actor on main's ruleset.
      - name: Push version bumps
        if: steps.fold.outputs.folded == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add -A charts
          git commit -s -m "chore(release): fold change fragments" -m "$(cat "${RUNNER_TEMP}/folded.txt")"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # A merge can land after checkout. If the rebase conflicts, that merge's own run folds again.
          for _ in 1 2 3; do
            git push "${remote}" HEAD:main && exit 0
            git pull --rebase "${remote}" main
          done
          exit 1

  package:
    needs: fold
    if: needs.fold.outputs.folded == 'false'
    permissions:
      contents: read  # to check out the repository and read release tags
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.list-changed.outputs.changed }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.fold.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Mirrors lookup_latest_tag / lookup_changed_charts from
      # helm/chart-releaser-action's cr.sh (v1.7.0).
      - name: List changed charts
        id: list-changed
        run: |
          set -euo pipefail
          git fetch --tags >/dev/null 2>&1 || true
          if ! latest_tag=$(git describe --tags --abbrev=0 HEAD~ 2>/dev/null); then
            latest_tag=$(git rev-list --max-parents=0 --first-parent HEAD)
          fi
          echo "Discovering changed charts since '${latest_tag}'..."

          changed_charts=()
          while IFS= read -r chart; do
            [[ -n "${chart}" && -d "${chart}" ]] || continue
            if [[ -f "${chart}/Chart.yaml" ]]; then
              changed_charts+=("${chart}")
            else
              echo "WARNING: ${chart}/Chart.yaml is missing, assuming that '${chart}' is not a Helm chart. Skipping." >&2
            fi
          done < <(git diff --find-renames --name-only "${latest_tag}" -- charts | cut -d '/' -f 1-2 | uniq)

          if [[ ${#changed_charts[@]} -eq 0 ]]; then
            echo "Nothing to do. No chart changes detected."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changed charts: ${changed_charts[*]}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "charts=${changed_charts[*]}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Helm
        if: steps.list-changed.outputs.changed == 'true'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3 # Also update in lint-and-test.yaml

      - name: Add dependency chart repos
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          helm repo add dandydeveloper https://dandydeveloper.github.io/charts/

      - name: Build chart dependencies
        if: steps.list-changed.outputs.changed == 'true'
        env:
          CHARTS: ${{ steps.list-changed.outputs.charts }}
        run: |
          set -euo pipefail
          read -ra charts <<< "${CHARTS}"
          for chart in "${charts[@]}"; do
            helm dependency build "${chart}"
          done

      - name: Verify subchart digests
        if: steps.list-changed.outputs.changed == 'true'
        env:
          CHARTS: ${{ steps.list-changed.outputs.charts }}
        run: |
          set -euo pipefail
          read -ra charts <<< "${CHARTS}"
          ./scripts/verify-chart-dependencies.sh "${charts[@]}"

      # Packages the verified dependencies as-is (no --dependency-update), so
      # only checked archives are signed. The signing key name comes from
      # .github/configs/cr.yaml.
      # The GitHub repository secret `PGP_PRIVATE_KEY` contains the private key
      # in ASCII-armored format. To export a (new) key, run this command:
      # `gpg --armor --export-secret-key <my key>`
      # The key only exists on disk for the duration of this step.
      - name: Package and sign charts
        if: steps.list-changed.outputs.changed == 'true'
        env:
          CHARTS: ${{ steps.list-changed.outputs.charts }}
          PGP_PRIVATE_KEY: "${{ secrets.PGP_PRIVATE_KEY }}"
          PGP_PASSPHRASE: "${{ secrets.PGP_PASSPHRASE }}"
        run: |
          set -euo pipefail
          signing_key=$(yq '.key' ./.github/configs/cr.yaml)
          if [[ -z "${signing_key}" || "${signing_key}" == "null" ]]; then
            echo "::error::No signing key name set in .github/configs/cr.yaml"
            exit 1
          fi

          key_dir="${RUNNER_TEMP}/signing"
          trap 'rm -rf "${key_dir}"' EXIT
          mkdir -m 700 "${key_dir}"
          printf '%s\n' "${PGP_PRIVATE_KEY}" | gpg --dearmor > "${key_dir}/secring.gpg"
          # Only pass a passphrase file when the secret holds one: helm rejects
          # an empty passphrase file.
          sign_args=(--sign --key "${signing_key}" --keyring "${key_dir}/secring.gpg")
          if [[ -n "${PGP_PASSPHRASE}" ]]; then
            printf '%s\n' "${PGP_PASSPHRASE}" > "${key_dir}/passphrase.txt"
            sign_args+=(--passphrase-file "${key_dir}/passphrase.txt")
          fi

          rm -rf .cr-release-packages
          mkdir -p .cr-release-packages
          read -ra charts <<< "${CHARTS}"
          for chart in "${charts[@]}"; do
            echo "Packaging chart '${chart}'..."
            helm package "${chart}" \
              --destination .cr-release-packages \
              "${sign_args[@]}"
          done

      - name: Remove signing material
        if: always()
        run: |
          rm -rf "${RUNNER_TEMP}/signing"

      - name: Upload chart packages
        if: steps.list-changed.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart-packages
          path: .cr-release-packages/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [fold, package]
    if: needs.package.outputs.changed == 'true'
    permissions:
      contents: write  # for chart-releaser to create releases and push the index to gh-pages
      packages: write  # to push OCI chart package to GitHub Registry
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.fold.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3 # Also update in lint-and-test.yaml

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      ## This is required to consider the old Circle-CI Index and to stay compatible with all the old releases.
      - name: Fetch current Chart Index
        run: |
          git checkout origin/gh-pages index.yaml

      - name: Install chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          install_only: true

      - name: Download chart packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chart-packages
          path: .cr-release-packages

      # Same `cr upload` / `cr index` invocations as release_charts and
      # update_index in helm/chart-releaser-action's cr.sh (v1.7.0).
      - name: Run chart-releaser
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"

          echo 'Releasing charts...'
          cr upload -o "${owner}" -r "${repo}" -c "$(git rev-parse HEAD)" --config ./.github/configs/cr.yaml

          echo 'Updating charts repo index...'
          cr index -o "${owner}" -r "${repo}" --push --config ./.github/configs/cr.yaml

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push chart to GHCR
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          shopt -s nullglob
          for pkg in .cr-release-packages/*.tgz; do
            if [ -z "${pkg:-}" ]; then
              break
            fi
            helm push "${pkg}" "oci://ghcr.io/${REPOSITORY}"
          done
