## Lints the GitHub Actions workflows themselves plus repo shell scripts:
## actionlint (workflow correctness + shellcheck of embedded run blocks),
## shellcheck (scripts/*.sh), and zizmor (Actions security audit, config in
## .github/zizmor.yml).
name: Actions Lint
on:
  # No path filter on pull requests: the zizmor job is a required status
  # check, and a filtered-out required check never reports.
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/zizmor.yml"
      - "scripts/*.sh"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Clone the repository to lint workflow files
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        env:
          # Embedded run-block shellcheck: enforce warning and above; info-level
          # notes (e.g. SC2086 quoting style in pre-existing scripts) do not fail.
          SHELLCHECK_OPTS: -S warning
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  shellcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Clone the repository to lint shell scripts
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run shellcheck on repo scripts
        run: shellcheck -S warning scripts/*.sh

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Clone the repository to audit workflow files
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          inputs: .github/workflows/
          advanced-security: false
          # Pinned so a new zizmor release cannot fail this required check on
          # unchanged workflows. Bump manually, like actionlint above.
          version: 1.30.1
